apiVersion: fleet.sponzey.dev/v1alpha1
kind: Runbook
name: nginx-basic
description: Install nginx and make sure the service is running.
selector: role=web
strategy:
  concurrency: 1
  maxFailures: 1
checkMode: false
dryRun: false
steps:
  - id: nginx-package
    package:
      name: nginx
      state: present
  - id: nginx-service
    service:
      name: nginx
      state: started
      enabled: true
